sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
tink = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
zxcvbn = { module = "com.nulab-inc:zxcvbn", version.ref = "zxcvbn" }
