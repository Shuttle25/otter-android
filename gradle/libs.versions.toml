[versions]
androidx-exifinterface = "1.3.7"
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.3.0"
hilt = "2.57.2"
hiltNavigationCompose = "1.3.0"
room = "2.8.3"
sqlite = "2.6.1"
sqlcipher = "4.11.0"
