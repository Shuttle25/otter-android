room = "2.8.3"
sqlite = "2.6.1"
sqlcipher = "4.11.0"
composeBom = "2025.10.01"
coreKtx = "1.17.0"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
navigation = "2.9.5"
tink = "1.19.0"
protobuf = "4.32.1"
protobufPlugin = "0.9.5"
coroutines = "1.10.2"
junit = "4.13.2"
robolectric = "4.16"
androidxTestCore = "1.7.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
